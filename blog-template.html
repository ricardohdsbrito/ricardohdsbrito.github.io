<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網誌文章</title>
    <!-- 引入與主頁一模一樣的午夜深鈷藍樣式表 -->
    <link rel="stylesheet" href="style.css">
    <style>
        .blog-template-body { background-color: #f8fafc; padding-top: 140px; overflow-x: hidden; }
        .article-card { max-width: 850px; margin: 0 auto; background: #ffffff; padding: 50px 60px; border-radius: 32px; box-shadow: 0 20px 80px rgba(10,29,55,0.02); border: 1px solid #e5e7eb; position: relative; margin-bottom: 60px !important; }
        
        /* 🎨 大廠級微光懸浮膠囊返回按鈕 (Premium Back Capsule Button) */
        .back-btn { 
            display: inline-flex; align-items: center; gap: 10px; color: #0A1D37; text-decoration: none; font-weight: 700; font-size: 14.5px; margin-bottom: 45px; background-color: #ffffff; padding: 10px 24px; border-radius: 50px; border: 1px solid #e5e7eb; box-shadow: 0 4px 15px rgba(10, 29, 55, 0.02); transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1); 
        }
        .back-btn:hover { 
            transform: translateY(-2px); color: #0066FF; border-color: rgba(0, 102, 255, 0.2); box-shadow: 0 8px 25px rgba(0, 102, 255, 0.06); 
        }
        .back-btn i { transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .back-btn:hover i { animation: thmArrowPulse 0.8s infinite alternate cubic-bezier(0.445, 0.05, 0.55, 0.95); }
        @keyframes thmArrowPulse { 0% { transform: translateX(0); } 100% { transform: translateX(-5px); } }

        .meta-info { font-size: 14px; color: #5A738E; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* 效果一：純 CSS 頂部滾動進度條 */
        @keyframes thmProgress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        .scroll-progress-bar { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background-color: #0066FF; z-index: 2000; transform-origin: top left; animation: thmProgress linear both; animation-timeline: scroll(root); }

        /* ==========================================================================
           網誌內文極致排版與左右兩端對齊樣式 (Justified Premium Typography)
           ========================================================================== */
        .markdown-render {
            text-align: justify;
            text-justify: inter-ideograph;
        }
        .markdown-render h1 { color: #0A1D37; font-size: 36px; margin-bottom: 30px; font-weight: 800; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px; letter-spacing: -0.5px; }
        .markdown-render h2 { color: #0A1D37; font-size: 26px; margin-top: 45px; margin-bottom: 18px; font-weight: 700; letter-spacing: -0.3px; }
        .markdown-render h3 { color: #2C3E50; font-size: 20px; margin-top: 35px; margin-bottom: 14px; font-weight: 700; }
        .markdown-render p { color: #2C3E50; font-size: 16.5px; line-height: 1.9; margin-bottom: 24px; }
        .markdown-render ul { margin-left: 25px; margin-bottom: 24px; color: #2C3E50; }
        .markdown-render li { margin-bottom: 10px; font-size: 16.5px; line-height: 1.8; }
        
        /* 原生對齊 1234 戰術縮排盒 */
        .markdown-render-box {
            margin: 35px 0 35px 45px !important; background-color: #f4f8fb !important; padding: 22px 28px 22px 42px !important; border-left: 4px solid #5A738E !important; border-radius: 0 16px 12px 0 !important; color: #2C3E50 !important; font-size: 16px !important; line-height: 1.9 !important; transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .markdown-render-box:hover { transform: scale(1.015) translateX(3px); border-left-color: #0066FF !important; box-shadow: 0 15px 30px rgba(0, 102, 255, 0.03); }
        .markdown-render-box li { margin-bottom: 12px !important; list-style-type: decimal !important; }

        /* 引用區塊 <blockquote> */
        .markdown-render blockquote { margin: 35px 0; background: linear-gradient(to right, rgba(0, 102, 255, 0.03), rgba(0, 102, 255, 0.01)); border-left: 5px solid #0066FF; padding: 20px 30px; border-radius: 0 16px 16px 0; font-style: italic; }
        .markdown-render blockquote p { color: #0A1D37 !important; font-weight: 600; margin-bottom: 0 !important; }

        /* 程式碼微標籤 <code> */
        .markdown-render code { background-color: #f1f5f9; color: #0066FF; padding: 3px 8px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 14.5px; font-weight: 700; margin: 0 4px; border: 1px solid #e2e8f0; }

        /* 懸浮文字「螢光筆劃線」特效 */
        .markdown-render strong { color: #0A1D37 !important; font-weight: 800 !important; position: relative; text-decoration: none; z-index: 1; display: inline-block; }
        .markdown-render strong::after { content: ""; position: absolute; left: 0; bottom: 2px; width: 100%; height: 35%; background-color: rgba(0, 102, 255, 0.15); transform: scaleX(0); transform-origin: bottom left; transition: transform 0.35s cubic-bezier(0.165, 0.84, 0.44, 1); z-index: -1; }
        .markdown-render strong:hover::after { transform: scaleX(1); }
        
        .markdown-render hr { border: 0; height: 1px; background: linear-gradient(to right, #e5e7eb, #5A738E, #e5e7eb); margin: 50px 0; opacity: 0.6; }
        .end-trigger-zone { text-align: center; padding: 20px 0; color: #5A738E; font-size: 14px; font-weight: 700; letter-spacing: 2px; position: relative; }

        /* 空氣阻力與落葉搖擺 3D 絲滑彩花物理核心 */
        .thm-center-confetti { position: fixed; z-index: 9999; pointer-events: none; left: 50%; top: 55%; transform-style: preserve-3d; will-change: transform, opacity; }
        @keyframes thmAdvancedConfetti {
            0% { transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg); opacity: 1; }
            20% { transform: translate3d(var(--x-explode), var(--y-explode), 0) rotateX(180deg) rotateY(90deg) rotateZ(var(--rot-mid)); opacity: 1; }
            100% { transform: translate3d(var(--x-drift), var(--y-drift), 0) rotateX(720deg) rotateY(540deg) rotateZ(var(--rot-end)); opacity: 0; }
        }
        .thm-center-confetti.fire { animation: thmAdvancedConfetti 3.8s cubic-bezier(0.1, 0.8, 0.25, 1) forwards; }
    </style>
</head>
<body class="blog-template-body">

    <!-- 滾動進度條 -->
    <div class="scroll-progress-bar"></div>

    <article class="article-card">
        <!-- 膠囊返回連結 -->
        <a href="index.html#blog" class="back-btn"><i class="fa-solid fa-arrow-left"></i> 返回網誌首頁</a>
        <div id="meta-date" class="meta-info">發佈日期 // 2026年08月10日</div>
        
        <!-- ⚡ 你的真實外部文章會精準渲染在下面這個框框中 -->
        <div id="markdown-content" class="markdown-render">文章正在光速加載中...</div>
        <div id="article-end-marker" class="end-trigger-zone">--- COMPLETED / 感謝閱讀 ---</div>
    </article>

    <script>
        // 純原生空格、雙星號不貪婪翻譯官大腦
        function simpleMarkdownParser(md) {
            let markdownBody = md;
            markdownBody = markdownBody.replace(/^\s{4}\d+\.\s(.*$)/gim, '<li class="indented-li">$1</li>');
            markdownBody = markdownBody.replace(/((?:<li class="indented-li">.*<\/li>\s*)+)/gim, '<ol class="markdown-render-box">$1</ol>');
            markdownBody = markdownBody.replace(/^>\s(.*$)/gim, '<blockquote><p>$1</p></blockquote>');
            markdownBody = markdownBody.replace(/`(.*?)`/gim, '<code>$1</code>');
            
            // 精確匹配粗體 (.*?)，100% 絕對不會再吞掉整段文字變粗！
            markdownBody = markdownBody.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');

            let htmlResult = markdownBody
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/^---$/gim, '<hr>')
                .replace(/^\* (.*$)/gim, '<li>$1</li>')
                .replace(/^(?!<h|<li|<ul|<ol|<hr|<blockquote)(.*$)/gim, '<p>$1</p>')
                .replace(/(?!<ol class="markdown-render-box">)(<li>.*<\/li>)(?!<\/ol>)/gim, '<ul>$1</ul>')
                .replace(/<\/ul>\s*<ul>/gim, '')
                .replace(/<\/blockquote>\s*<blockquote>/gim, '');

            return htmlResult;
        }

        document.addEventListener("DOMContentLoaded", () => {
            // 1. 智慧識別網址參數（?file=article1.md）
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file');

            if (!fileName) {
                document.getElementById('markdown-content').innerHTML = "<h1>錯誤：找不到文章檔案</h1>";
                return;
            }

            // 2. 正式出門連線讀取您專屬的外部文章
            fetch(fileName)
                .then(response => {
                    if (!response.ok) throw new Error();
                    return response.text();
                })
                .then(text => {
                    // 3. 過濾 Front Matter 設定檔
                    const parts = text.split('---');
                    let markdownBody = parts.length >= 3 ? parts.slice(2).join('---') : text;

                    // 🌟 終極自動識別：從你自己的 md 檔案最頂部，精準抓取你寫的 title 內容！
                    const titleMatch = text.match(/title:\s*"([^"]+)"/i) || text.match(/title:\s*([^\r\n]+)/i);
                    if (titleMatch) {
                        const cleanTitle = titleMatch[1] || titleMatch[0];
                        document.title = cleanTitle.replace(/['"]/g, "") + " - 網誌文章";
                    }

                    // 4. 翻譯您專屬的文案並點亮網頁！
                    const htmlResult = simpleMarkdownParser(markdownBody.trim());
                    document.getElementById('markdown-content').innerHTML = htmlResult;
                    
                    // 5. 啟動進度條滿格全自動拉炮
                    initAutomaticScrollConfetti();
                })
                .catch(() => {
                    document.getElementById('markdown-content').innerHTML = "<h1>文章加載失敗</h1><p>請確認您的 article1.md 檔案是否與本檔案在同一個資料夾下。</p>";
                });
        });

        // 智慧滾動比例監聽器（當碌到最底 100% 時自動引爆）
        function initAutomaticScrollConfetti() {
            let isFired = false;
            window.addEventListener("scroll", () => {
                if (isFired) return;
                const totalScrollableHeight = document.documentElement.scrollHeight - window.innerHeight;
                if (totalScrollableHeight <= 40) return; 
                const currentScrollPercent = (window.scrollY / totalScrollableHeight) * 100;
                if (currentScrollPercent >= 96.5) {
                    isFired = true; 
                    fireAdvancedPremiumBurst(); 
                }
            });
        }

        // 大廠級落葉流體物理拉炮核心 (3.8秒慢速優雅下落)
        function fireAdvancedPremiumBurst() {
            const colors = ['#0066FF', '#5A738E', '#bae6fd', '#0A1D37', '#ffcd56', '#ffffff'];
            const container = document.body;
            for (let i = 0; i < 85; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'thm-center-confetti fire';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                const randomWidth = Math.random() * 8 + 6;  
                const randomHeight = Math.random() * 6 + 4; 
                confetti.style.width = randomWidth + 'px';
                confetti.style.height = randomHeight + 'px';
                const originOffsetX = (Math.random() * 60 - 30);
                confetti.style.marginLeft = originOffsetX + 'px';
                const angle = Math.random() * Math.PI * 2; 
                const explodeSpeed = Math.random() * 280 + 120; 
                const xExplode = Math.cos(angle) * explodeSpeed;
                const yExplode = Math.sin(angle) * explodeSpeed - 160; 
                const driftDirection = Math.random() > 0.5 ? 1 : -1;
                const xDrift = xExplode + (Math.random() * 150 + 50) * driftDirection; 
                const yDrift = yExplode + (Math.random() * 400 + 400); 
                const rotMid = (Math.random() * 360) + 'deg';
                const rotEnd = (Math.random() * 1440 - 720) + 'deg'; 
                confetti.style.setProperty('--x-move', xExplode + 'px');
                confetti.style.setProperty('--y-move', yExplode + 'px');
                confetti.style.setProperty('--x-drift', xDrift + 'px');
                confetti.style.setProperty('--y-drift', yDrift + 'px');
                confetti.style.setProperty('--rot-mid', rotMid);
                confetti.style.setProperty('--rot-end', rotEnd);
                container.appendChild(confetti);
                setTimeout(() => { confetti.remove(); }, 3800);
            }
        }
    </script>
</body>
</html>
